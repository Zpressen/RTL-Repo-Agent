# Selected existing provider/model and Agent settings. No actual credentials.
llm:
  stream: true
  stream_include_usage: true
  model: gpt-6.1-sol
  max_tokens: 65536
  temperature: 0.6
  reasoning_effort: high
  provider: openai
  api_key: ${ZEROREPO_API_KEY}
  base_url: https://www.inroi.shop/v1
rtl_kg:
  enabled: true
  mode: required
  batch_size: 2000
  default_query_limit: 25
  max_query_rows: 100
  neo4j:
    uri: bolt://127.0.0.1:7687
    user: neo4j
    password: REPLACE_WITH_NEW_INDEPENDENT_KG_PASSWORD
rtl_module_planner:
  retrieval_limits:
    max_chunks: 24
    chunk_chars: 6000
    candidate_chars: 48000
    fact_chars: 8000
    prompt_chars: 64000
  request_policy:
    retrieval:
      total_timeout_seconds: 180
      max_tokens: 4096
      first_content_timeout_seconds: 120
      idle_timeout_seconds: 120
      max_retries: 1
    generation:
      total_timeout_seconds: 600
      first_content_timeout_seconds: 120
      idle_timeout_seconds: 120
      max_retries: 1
    stages:
      stage5_codegen:
        first_content_timeout_seconds: 240
        retry_first_content_timeout: true
  temporal_planning:
    enabled: true
rtl_debug:
  backend: codex
  codex_profile: proxy-a
  codex_model: ''
  max_trials: 30
  codex_multi_agent: false
  codex_timeout: 10800
  codex_bin: /opt/rtl-agent/toolchain/bin/codex
