# ZeroRepo Main Configuration
# Complete configuration for the end-to-end ZeroRepo workflow

# ============================================================================
# LLM Configuration
# ============================================================================
llm:
  stream: true
  stream_include_usage: true
  model: "gpt-6.1-sol"
  max_tokens: 65536
  temperature: 0.6
  reasoning_effort: "high"
  provider: "openai"
  # Never commit real keys — export ZEROREPO_API_KEY in your shell instead.
  api_key: "${ZEROREPO_API_KEY}"
  base_url: "https://www.inroi.shop/v1"
  # api_version: ""
  # tenant_id: ""
  # token_scope: ""
# ============================================================================
# Property Level Configuration (PropBuilder)
# ============================================================================
prop_level:
  # Feature generation parameters
  feature_selection:
    # feature_tree_path, frequency_path, vec_db_path are only required when mode="feature".
    # In "simple" mode they can be omitted.
    # feature_tree_path: "./data/seed42-step9001-27000_merged_fea_ori.json"
    # frequency_path: "./data/seed42-step9001-27000_merged_fea_ori_fre.json"
    # vec_db_path: "./data/vec_db"
    mode: "simple"  # "feature" for multi-agent, "simple" for single-agent
    explore_conditions: [5, 8, 5, 4, 5]
    select_max_iterations: 2
    select_context_window: 0
    temperature: 10
    overlap_pct: 0

  # Feature refactoring parameters
  feature_refactoring:
    refactor_max_iterations: 40
    refactor_context_window: 0

# ============================================================================
# Implementation Level Configuration (ImplBuilder)
# ============================================================================
impl_level:
  # File design configuration
  file_design_cfg_path: "configs/file_design_config.yaml"
  # Function design configuration  
  func_design_cfg_path: "configs/func_design_config.yaml"

# ============================================================================
# RTL Knowledge Graph Configuration
# ============================================================================
rtl_kg:
  # External service boundary:
  # - Start Neo4j outside ZeroRepo (for example with /home/mokita/RTL-Agent/docker-compose.dev.yml
  #   under the RTL-Agent conda environment).
  # - ZeroRepo does NOT start Docker/Neo4j for you.
  # - Once enabled, ZeroRepo connects to the running service, writes KG snapshots at fixed pipeline
  #   stages, and exposes read-only Cypher query capability to RTL agents.
  enabled: true
  mode: "required"
  rtl_agent_root: "/home/mokita/RTL-Agent/RTL-Fix-Agent/knowledge_graph"
  batch_size: 2000
  default_query_limit: 25
  max_query_rows: 100
  neo4j:
    uri: "bolt://localhost:7687"
    user: "neo4j"
    password: "neo4j123456"

# ============================================================================
# RTL Module Planner Configuration
# ============================================================================
rtl_module_planner:
  retrieval_limits:
    max_chunks: 24
    chunk_chars: 6000
    candidate_chars: 48000
    fact_chars: 8000
    prompt_chars: 64000
  request_policy:
    retrieval:
      total_timeout_seconds: 180
      max_tokens: 4096
      first_content_timeout_seconds: 120
      idle_timeout_seconds: 120
      max_retries: 1
    generation:
      total_timeout_seconds: 600
      first_content_timeout_seconds: 120
      idle_timeout_seconds: 120
      max_retries: 1
    stages:
      stage5_codegen:
        first_content_timeout_seconds: 240
        retry_first_content_timeout: true
  temporal_planning:
    # Enabled by default in code; set false only for baseline/ablation runs.
    enabled: true

# ============================================================================
# RTL Debug Configuration
# ============================================================================
rtl_debug:
  # "repo_react" uses the existing AgentScope debugger; "codex" starts the
  # task-scoped Codex Debug MCP backend.
  backend: "codex"
  # Named Codex CLI profile. Leave codex_model empty so the profile selects
  # both the model and reasoning effort.
  codex_profile: "proxy-a"
  codex_model: ""
  # Each non-empty validate_rtl_changes(action="evaluate") consumes one trial.
  max_trials: 30
  # Enable Codex subagents only for explicit multi-agent experiment groups.
  codex_multi_agent: false
  # Maximum wall-clock time for the full Codex Debug session, including resumes.
  codex_timeout: 10800

# ============================================================================
# Code Generation Configuration (IterativeCodeGenerator)
# ============================================================================
code_generation:
  # Docker configuration
  docker:
    enabled: true
    image: "python-azure-pytest:3.12"
    container_name: "zerorepo_2"
    force_rebuild: True
    workspace: "/tare_workspace"

  # TRAE Agent configuration
  trae_agent:
    trae_config: "./configs/trae_config.yaml"
    max_retries: 3
    retry_delay: 5  # seconds
    
    # Execution parameters
    max_iterations: 5
    max_retries_per_workflow: 3
    workflow_timeout: 1800
  
