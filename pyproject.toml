[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zerorepo-agent"
version = "0.1.0"
description = "ZeroRepo RTL Agent core"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["zerorepo*"]
exclude = ["zerorepo.rtl_web*", "*third_party*", "*build*", "*__pycache__*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.md", "*.scm", "*.yaml", "*.json", "*.v", "*.sv", "*.so"]
